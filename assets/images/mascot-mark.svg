       feuille + nervure (raccourcie pour laisser la place au visage), avec deux yeux, un
       sourire et des joues. Source de vérité pour la régénération de icon.png,
       android-icon-foreground.png, android-icon-monochrome.png et splash-icon.png — doit
       rester visuellement identique à la variante "calm" de src/components/mascot.tsx si
       l'un des deux est retouché. logo-mark.svg (sans visage) reste la source pour
       favicon.png, où le visage ne se lit plus (< ~40px). -->
