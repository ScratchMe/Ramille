# Sauvegarde hebdomadaire de la base Supabase (chantier C0.2 du plan v1-13, constat C-7).
#
# POURQUOI CE FICHIER EXISTE. Le projet est sur le plan gratuit Supabase : aucune sauvegarde
# quotidienne n'est incluse, et aucun point de restauration n'existe côté plateforme — relevé le
# 10/09/2026, `GET /v1/projects/<ref>/database/backups` rend `{"backups":[],"pitr_enabled":false}`.
# Les migrations reconstruisent le schéma et les référentiels, jamais un bilan, un engagement ni
# une réponse de check-in. Deux chemins de destruction tournent chaque nuit
# (`purge_stale_anonymous_accounts()`, `purge_usage_events()`) : sans instantané, une erreur
# de prédicat est définitive.
#
# OÙ VA L'ARCHIVE, ET POURQUOI PAS DANS UN ARTEFACT GITHUB (17/09/2026). Elle partait dans un
# artefact de workflow, ce qui tenait tant que le dépôt était privé. **Un artefact est
# téléchargeable par toute personne ayant accès en lecture au dépôt** : public, c'est tout le
# monde, et rétroactivement — les archives déjà déposées deviennent accessibles au moment du
# basculement, pas seulement les suivantes. Or celle-ci porte `auth.users`, donc les adresses
# email de tous les comptes. Le chiffrement GPG serait alors devenu la *seule* frontière, face à
# un attaquant qui a l'archive hors ligne et sans limite d'essais.
#
# L'archive part donc dans un bucket **Cloudflare R2 privé**, en juridiction UE. Ce qui n'a pas
# changé : le moteur reste GitHub Actions, parce qu'il est gratuit et illimité sur un dépôt
# public et que ce fichier a déjà payé trois pièges qu'on ne veut pas repayer (client PG 17,
# pooler en mode session, `--pinentry-mode loopback`). C'est la **destination** qui change, pas
# l'exécuteur. Le chiffrement GPG est **conservé** bien que le bucket soit privé : deux
# barrières, pour qu'un bucket mal configuré un jour ne soit pas une catastrophe.
#
# Régime retenu, procédure de restauration et secrets à créer : docs/exploitation/sauvegarde.md.
name: Sauvegarde de la base

on:
  schedule:
    # Dimanche 2h UTC, volontairement avant les crons de la semaine : la génération des
    # check-ins hebdomadaires passe le lundi à 6h UTC et l'envoi des rappels à 7h UTC.
    # L'instantané précède donc les écritures automatiques de la semaine, pas l'inverse.
    - cron: '0 2 * * 0'
  # Déclenchement manuel : c'est le chemin à utiliser avant toute reprise de calcul en masse
  # (recompute_assessment_results en boucle, purge modifiée), cf. la règle du document.
  workflow_dispatch:

# Deux dumps simultanés n'apporteraient rien et ouvriraient deux connexions de plus sur une
# base de plan gratuit.
concurrency:
  group: sauvegarde-base
  cancel-in-progress: false

jobs:
  dump:
    name: Export chiffré (pg_dump)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SAUVEGARDE_PASSPHRASE: ${{ secrets.SAUVEGARDE_PASSPHRASE }}
      # L'endpoint porte l'identifiant de compte Cloudflare et **le préfixe `.eu.`** de la
      # juridiction : sans lui, le client s'adresse à la juridiction par défaut et ne voit pas le
      # bucket. C'est pour ça qu'il vit dans un secret plutôt qu'en clair dans ce fichier, qui est
      # public. Le nom du bucket n'est pas un secret ; il est rangé au même endroit pour qu'il n'y
      # ait qu'un seul écran à ouvrir quand on met la sauvegarde en service.
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # Le CLI `aws` lit ces deux noms-là, pas `R2_*` : le jeton R2 est un couple de clés S3.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      # `auto` est exigé par le SDK et ignoré par R2 (doc Cloudflare). Sans région, le CLI refuse
      # de partir.
      AWS_DEFAULT_REGION: auto
      # Garde-fou de version, et non correction d'un défaut reproduit. Les CLI `aws` récents
      # calculent des sommes de contrôle supplémentaires par défaut, et le runner met le sien à
      # jour sans que ce dépôt bouge — même famille que l'étape `expo-doctor` de la CI, qui peut
      # rougir sur un arbre qu'on n'a pas touché. Ces deux variables ramènent le comportement à
      # « seulement quand c'est nécessaire » ; un CLI qui ne les connaît pas les ignore, donc
      # elles ne coûtent rien.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      # Un secret absent rend `pg_dump` silencieusement inopérant : sans cette garde, le job
      # téléverserait un artefact vide et se terminerait en vert. C'est exactement le mode de
      # défaillance qu'une sauvegarde ne peut pas se permettre — on ne découvre l'absence de
      # contenu que le jour où l'on restaure.
      - name: Vérifier que les secrets existent
        run: |
          set -euo pipefail
          manquants=""
          [ -n "${SUPABASE_DB_URL:-}" ] || manquants="$manquants SUPABASE_DB_URL"
          [ -n "${SAUVEGARDE_PASSPHRASE:-}" ] || manquants="$manquants SAUVEGARDE_PASSPHRASE"
          [ -n "${R2_ENDPOINT:-}" ] || manquants="$manquants R2_ENDPOINT"
          [ -n "${R2_BUCKET:-}" ] || manquants="$manquants R2_BUCKET"
          [ -n "${AWS_ACCESS_KEY_ID:-}" ] || manquants="$manquants R2_ACCESS_KEY_ID"
          [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || manquants="$manquants R2_SECRET_ACCESS_KEY"
          if [ -n "$manquants" ]; then
            echo "::error::Secrets de dépôt manquants :$manquants. Les créer dans Settings > Secrets and variables > Actions (voir docs/exploitation/sauvegarde.md)."
            exit 1
          fi

      # Le runner ubuntu-latest embarque un client PostgreSQL dont la version suit l'image et
      # peut être antérieure au serveur : `pg_dump` refuse de dumper une base plus récente que
      # lui. Le serveur est en **PostgreSQL 17.6** (relevé le 10/09/2026 sur le projet distant),
      # donc le client 15 ou 16 du runner échouerait. On installe explicitement le client 17
      # depuis le dépôt PGDG, compatible avec tous les serveurs 15 et plus. Le jour où le projet
      # passe en 18, c'est cette ligne qu'il faut changer, et rien d'autre.
      - name: Installer le client PostgreSQL 17
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      # Deux fichiers et non un, parce qu'ils ne se restaurent pas de la même façon (détail
      # dans docs/exploitation/sauvegarde.md) :
      #   - `public` part avec son schéma : dans un projet neuf, ces tables n'existent pas.
      #     `supabase_migrations` l'accompagne pour que l'historique des migrations voyage avec
      #     la sauvegarde : sans lui, une base restaurée ne sait plus où elle en est, et on ne
      #     peut plus dire quelle migration le dump reflète.
      #   - `auth` part en données seules, et seulement auth.users / auth.identities : les
      #     tables du schéma auth sont créées par la plateforme dans tout projet Supabase, et
      #     tenter de les recréer échouerait. auth.users est la racine de toutes les cascades,
      #     auth.identities porte le rattachement Google/email.
      # `--no-owner` / `--no-privileges` : les rôles d'un autre projet ne sont pas les mêmes.
      # Les GRANTs ne reviennent donc pas avec le dump, et aucune migration n'est rejouée à la
      # restauration : on rejoue le seul fichier de grants, cf. sauvegarde.md §4 étape 6.
      # La chaîne de connexion n'est jamais affichée : pas de `set -x` ici, et aucun `echo`
      # de la variable.
      - name: Dumper la base
        run: |
          set -euo pipefail
          horodatage="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "horodatage=$horodatage" >> "$GITHUB_ENV"
          mkdir -p sauvegarde
          pg_dump "$SUPABASE_DB_URL" \
            --schema=public \
            --schema=supabase_migrations \
            --no-owner --no-privileges \
            --quote-all-identifiers \
            --format=plain \
            --file=sauvegarde/public.sql
          pg_dump "$SUPABASE_DB_URL" \
            --data-only \
            --table=auth.users \
            --table=auth.identities \
            --no-owner --no-privileges \
            --quote-all-identifiers \
            --format=plain \
            --file=sauvegarde/auth.sql

      # Un dump techniquement réussi mais vide (connexion sur la mauvaise base, schéma
      # inaccessible au rôle) pèse quelques centaines d'octets et ne dit rien de lui-même.
      # On exige donc la présence de deux tables applicatives dont l'absence ne peut pas être
      # une évolution normale du produit.
      #
      # LA TAILLE ET LES `CREATE TABLE` NE PROUVENT QUE LE SCHÉMA. `pg_dump --schema=public`
      # émet les `CREATE TABLE` et un bloc `COPY` même quand toutes les tables sont vides, et un
      # dump schéma-seul dépasse de loin le plancher de 1024 octets : un dump sans la moindre
      # donnée (mauvaise base, rôle sans lecture sur les lignes, option mal posée un jour)
      # passerait en vert et ne se découvrirait qu'à la restauration. D'où la dernière garde, sur
      # les **données** d'un référentiel qui ne peut pas être vide : `transport_modes` porte une
      # vingtaine de modes et n'en perdra pas les trois quarts (le plancher est à 10, pour
      # qu'une réorganisation du référentiel ne fasse pas rougir la sauvegarde). On compte les
      # lignes de son bloc `COPY`, du `FROM stdin;` au `\.` qui le termine.
      - name: Vérifier que le dump a du contenu
        run: |
          set -euo pipefail
          for f in sauvegarde/public.sql sauvegarde/auth.sql; do
            taille=$(stat -c%s "$f")
            echo "$f : $taille octets"
            if [ "$taille" -lt 1024 ]; then
              echo "::error::$f fait $taille octets : le dump est vide ou tronqué."
              exit 1
            fi
          done
          for table in assessments assessment_answers plan_actions engagement_checkins; do
            if ! grep -q "CREATE TABLE \"public\".\"$table\"" sauvegarde/public.sql; then
              echo "::error::La table $table est absente du dump : la sauvegarde est incomplète."
              exit 1
            fi
          done
          if ! grep -q 'COPY "auth"."users"' sauvegarde/auth.sql; then
            echo "::error::auth.users est absent du dump : les comptes ne seraient pas restaurables."
            exit 1
          fi
          lignes=$(awk '/^COPY "public"."transport_modes" /{f=1;next} f&&/^\\\.$/{exit} f{c++} END{print c+0}' sauvegarde/public.sql)
          echo "transport_modes : $lignes lignes de données"
          if [ "$lignes" -lt 10 ]; then
            echo "::error::Le dump ne contient pas de données (transport_modes : $lignes lignes). Un dump schéma-seul n'est pas une sauvegarde."
            exit 1
          fi
          # L'historique des migrations est un confort de lecture, pas une condition de
          # restauration (la procédure ne rejoue aucune migration) : son absence avertit, elle
          # ne fait pas échouer la sauvegarde.
          if ! grep -q 'CREATE TABLE "supabase_migrations"."schema_migrations"' sauvegarde/public.sql; then
            echo "::warning::L'historique des migrations (supabase_migrations) n'est pas dans le dump : on ne saura pas quelle migration cette archive reflète."
          fi

      # L'artefact d'un dépôt privé reste lisible par toute personne ayant accès aux Actions,
      # et il contient des adresses email. Chiffrement symétrique AES-256 avant dépôt, la
      # phrase de passe ne vivant que dans le secret de dépôt (et dans le gestionnaire de mots
      # de passe du titulaire — un artefact qu'on ne peut plus déchiffrer n'est pas une
      # sauvegarde). `--passphrase-fd 0` : la phrase passe par l'entrée standard, jamais par la
      # ligne de commande, qui serait visible dans la liste des processus.
      #
      # `--pinentry-mode loopback` n'est pas décoratif. Depuis GnuPG 2.1, une phrase de passe
      # fournie par `--passphrase-fd` n'est acceptée que si la boucle locale est demandée
      # explicitement : sans elle, gpg s'adresse à son agent et sort en « problem with the
      # agent » / « Inappropriate ioctl for device ». ubuntu-latest embarque gpg 2.4, donc le job
      # échouerait à **toutes** ses exécutions et la sauvegarde ne produirait jamais d'artefact —
      # panne que rien dans le dépôt ne peut attraper, la CI ne jouant pas ce workflow.
      - name: Chiffrer l'archive
        run: |
          set -euo pipefail
          tar -czf "sauvegarde-$horodatage.tar.gz" -C sauvegarde public.sql auth.sql
          printf '%s' "$SAUVEGARDE_PASSPHRASE" | gpg --batch --yes \
            --pinentry-mode loopback \
            --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 \
            --output "sauvegarde-$horodatage.tar.gz.gpg" \
            "sauvegarde-$horodatage.tar.gz"
          # Les fichiers en clair ne doivent pas survivre à l'étape : seul le .gpg est déposé.
          rm -rf sauvegarde "sauvegarde-$horodatage.tar.gz"
          ls -l "sauvegarde-$horodatage.tar.gz.gpg"

      # **La rétention n'est plus ici.** Elle vivait dans `retention-days: 90` de l'artefact ;
      # elle vit maintenant dans une **règle de cycle de vie du bucket**, réglée dans le tableau
      # de bord Cloudflare (sauvegarde.md §3). Rien dans ce dépôt ne peut la voir ni la vérifier :
      # sans cette règle, la rétention est **infinie en silence**. Ce n'est pas un problème de
      # place — c'est une surface exposée qui grandit sans fin.
      #
      # Le dépôt et sa relecture sont deux étapes et pas une, parce que la seconde remplace une
      # garde perdue : `if-no-files-found: error` protégeait du cas « le job est vert et il n'y a
      # rien au bout ». Un `aws s3 cp` qui réussit ne prouve pas qu'un objet lisible existe.
      - name: Déposer l'archive sur R2
        run: |
          set -euo pipefail
          archive="sauvegarde-$horodatage.tar.gz.gpg"
          # La version du CLI est imprimée parce que c'est elle qui bouge sous nous : le garde-fou
          # de sommes de contrôle posé plus haut n'a de sens que si le log dit contre quoi il a
          # joué, le jour où un dépôt échoue sans qu'une ligne du dépôt ait changé.
          aws --version
          # `--only-show-errors` : la barre de progression du CLI n'apporte rien dans un log de
          # workflow et noie les lignes qui comptent.
          aws s3 cp "$archive" "s3://$R2_BUCKET/$archive" \
            --endpoint-url "$R2_ENDPOINT" \
            --only-show-errors
          echo "déposé : s3://$R2_BUCKET/$archive"

      # On relit l'objet et on compare sa taille à celle du fichier local. C'est ce qui demande au
      # jeton R2 la permission de **lecture en plus de l'écriture**, sur ce seul bucket : un jeton
      # en écriture seule rendrait cette vérification impossible, et une sauvegarde qu'on ne peut
      # pas constater n'en est pas une. Le compromis est tenable parce que l'archive est chiffrée
      # — un jeton volé ne donne que des octets illisibles.
      - name: Vérifier que l'archive est bien arrivée
        run: |
          set -euo pipefail
          archive="sauvegarde-$horodatage.tar.gz.gpg"
          locale=$(stat -c%s "$archive")
          distante=$(aws s3api head-object \
            --bucket "$R2_BUCKET" \
            --key "$archive" \
            --endpoint-url "$R2_ENDPOINT" \
            --query ContentLength --output text)
          echo "local : $locale octets — distant : $distante octets"
          if [ "$locale" != "$distante" ]; then
            echo "::error::L'objet déposé fait $distante octets contre $locale en local : le dépôt est incomplet."
            exit 1
          fi
