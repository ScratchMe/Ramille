name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  unit-tests:
    name: Tests unitaires (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --ci

  db-tests:
    name: Tests base de données (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Démarre une stack Postgres locale (Docker) à partir de supabase/config.toml et
      # applique supabase/migrations/ — indépendante du projet Supabase distant
      # TraceVerte-v1, cf. supabase/config.toml.
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db
