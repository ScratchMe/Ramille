name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # expo-env.d.ts est volontairement absent du repo (généré par `expo start`/`expo
      # run:*` — cf. son propre commentaire "should be in your git ignore") : sur un
      # checkout propre, sans dev server jamais lancé, `tsc` échoue sinon sur l'import
      # side-effect de global.css (types fournis via `/// <reference types="expo/types" />`).
      # Contenu statique, identique à celui qu'Expo génère lui-même.
      #
      # **Redondant depuis le `postinstall` de package.json, et gardé exprès.** Ce `printf`
      # était la seule chose qui faisait passer `tsc` sur un checkout propre — explication qui
      # ne vivait qu'ici, donc invisible pour qui clone le dépôt et suit le README. Le
      # `postinstall` règle le cas partout (poste, CI, agent) ; retirer cette étape dans le même
      # mouvement ferait qu'un `postinstall` silencieusement cassé rendrait la CI rouge sans
      # indice. Les deux cohabitent un cycle, et l'étape part ensuite.
      - run: printf '/// <reference types="expo/types" />\n' > expo-env.d.ts
      - run: npx tsc --noEmit
      # `api/` est le seul code du dépôt dont la boucle de retour est un déploiement en
      # production, et c'était le seul que rien ne typecheckait : le tsconfig racine l'exclut
      # explicitement, et Vercel compile ces fichiers avec esbuild, qui efface les types sans
      # les vérifier. Une erreur de type y partait donc en production pour se manifester en
      # `FUNCTION_INVOCATION_FAILED` sans détail côté client — le mode d'échec dont l'en-tête
      # d'api/share-card.ts raconte le coût de diagnostic.
      - run: npm run typecheck:api
      - run: npm run lint
      # Les dépendances n'étaient regardées par aucune des trois étapes. expo-doctor est la
      # garde la moins chère : versions incohérentes avec le SDK, modules natifs mal déclarés,
      # configuration d'app qui ne correspond plus aux paquets installés — tout ce qui ne se
      # voit ni au typecheck, ni aux tests, ni à l'export, et qui se paie à la prochaine
      # construction d'AAB.
      #
      # Version épinglée, pour la même raison que le CLI Supabase plus bas : `npx expo-doctor`
      # sans numéro télécharge la dernière version publiée à chaque passage. 1.20.4 relevé le
      # 10/09/2026 sur le registre npm : publiée le 26/08/2026 et toujours le `dist-tag` latest
      # ce jour-là. Pour la faire évoluer : changer le numéro ici et reporter sa date.
      #
      # **Mais épingler l'outil n'épingle pas ce qu'il attend, et cette étape peut donc rougir
      # sans qu'une ligne du dépôt ait bougé.** Le contrôle « packages match versions required by
      # installed Expo SDK » compare nos versions à celles qu'Expo recommande **au moment du
      # passage**, et ce jeu-là vit chez Expo, pas ici : le 11/09/2026 la CI est tombée sur onze
      # paquets « en retard » d'un patch, sur un arbre qui passait 21/21 quelques heures plus tôt.
      # Le commentaire d'origine promettait le contraire — il est corrigé plutôt que retiré, parce
      # que c'est la surprise qui coûte, pas l'étape.
      #
      # L'étape reste **bloquante**, et c'est délibéré : cette dérive est exactement ce qu'on veut
      # savoir avant une construction d'AAB, où elle se paierait bien plus cher. La conduite à
      # tenir quand elle rougit sur un arbre qu'on n'a pas touché : `npx expo install --fix`, puis
      # rejouer typecheck, lint, tests et export — ce n'est pas une panne, c'est Expo qui a publié.
      - run: npx expo-doctor@1.20.4

  unit-tests:
    name: Tests unitaires (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --ci

  web-export:
    name: Export web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # L'export est la seule façon de voir ce que le navigateur recevra vraiment. Deux
      # défauts s'y sont déjà cachés sans qu'aucun autre contrôle ne bronche : les routes
      # sans enfants renvoyaient 404 en production faute de `cleanUrls`, et les dix-huit
      # pages sortaient avec un `<title>` vide alors que le titre était bien déclaré (les
      # options du `Stack` n'agissent qu'après hydratation).
      - run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: cle-factice-pour-le-build
      - run: node scripts/verifier-titres-export.mjs
      # Une valeur `EXPO_PUBLIC_*` peut disparaître du bundle sans que rien ne bronche, et
      # l'app démarre alors sur une configuration vide — cf. l'en-tête du script.
      - run: node scripts/verifier-configuration-export.mjs
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: cle-factice-pour-le-build
      # Les deux gardes ci-dessus **lisent** le HTML produit ; aucune ne l'exécute. Le
      # 08/09/2026 un hook natif appelé au rendu du layout racine a emporté tout l'arbre
      # React — page blanche sur toutes les routes, avec une CI verte et vingt pages titrées.
      # Celle-ci ouvre vraiment les pages dans un navigateur, cf. l'en-tête du script.
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verifier-rendu-export.mjs
      # Le rappel par email ne porte qu'une URL : Android ne l'ouvre dans l'app que si le
      # domaine l'y autorise par ce fichier. Absent ou désignant un autre paquet, le lien
      # retombe dans le navigateur sans que rien ne le signale.
      - run: node scripts/verifier-assetlinks-export.mjs

  db-tests:
    name: Tests base de données (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Démarre une stack Postgres locale (Docker) à partir de supabase/config.toml et
      # applique supabase/migrations/ — indépendante du projet Supabase distant
      # TraceVerte-v1, cf. supabase/config.toml.
      #
      # Version épinglée, et pas `latest`. Le CLI apporte la stack locale entière (image
      # Postgres, rôles, privilèges par défaut, GoTrue, PostgREST) : en `latest`, cette moitié
      # de la CI changeait sous nos pieds à chaque sortie du CLI, sans qu'une ligne du dépôt
      # bouge — une suite rouge le lundi sur un commit vert le vendredi, sans rien à lire pour
      # le comprendre. Ce sont précisément les privilèges par défaut qui devaient nous tomber
      # dessus par là : c'est le CLI, et lui seul, qui décide si une nouvelle table du schéma
      # `public` arrive exposée ou non (cf. supabase/config.toml et
      # supabase/migrations/20260910110000_grants_explicites.sql).
      #
      # 2.117.0 relevé le 10/09/2026 sur le registre npm : publiée le 07/09/2026 et toujours le
      # `dist-tag` latest ce jour-là — c'est donc la version que `latest` installait déjà aux
      # derniers passages de cette CI. L'épinglage fige l'état connu, il ne le change pas.
      #
      # Pour la faire évoluer : changer le numéro ici, rien d'autre, et laisser la CI de la PR
      # le prouver. Une montée qui casse se lit alors dans le diff, ce qui est tout l'intérêt.
      # Reporter alors le numéro **et** sa date de publication ci-dessus, et ne jamais revenir à
      # `latest` : un tag qui n'existe pas fait tomber tout ce job, pas seulement une assertion.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: supabase db start
      - run: supabase test db
