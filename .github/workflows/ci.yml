name: CI

on:
  pull_request:
  # **Plus de `push` sur `main` depuis le 31/10/2026** : le dépôt repasse en privé, où le plan
  # gratuit ne donne que 2 000 minutes par mois, chaque travail arrondi à la minute. Relancer les cinq
  # travaux après chaque fusion coûtait ≈ 1 550 minutes par mois pour revérifier un état que la PR
  # venait de prouver. Ce qu'on perd : deux PR fusionnées coup sur coup qui ne cassent qu'ensemble —
  # la PR suivante et le passage du lundi le voient (`docs/exploitation/depot-public.md` §9).
  # Le lundi, sur le seul travail « Typecheck & lint » : expo-doctor y compare nos paquets à ce
  # qu'Expo recommande ce jour-là, et cette dérive vient d'Expo, pas d'un commit. Ce passage-là bloque.
  schedule:
    - cron: '37 5 * * 1'
  workflow_dispatch:

# Un nouveau passage d'une PR annule le précédent, devenu périmé. Les autres événements ont chacun
# leur groupe (l'identifiant d'exécution) : ni une exécution planifiée ni un lancement à la main ne sont
# jamais annulés ni mis en file derrière une autre.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Le jeton de ces travaux ne sert qu'au `checkout` : aucune étape n'écrit dans le dépôt ni ne commente
# une PR, et **une seule publie quelque chose** — la capture d'un échec du parcours réel, gardée sept
# jours (décision du 01/10/2026, plus bas). Déclarer le minimum à la racine l'applique à tous les travaux ;
# l'artefact passe par le jeton d'exécution du runner, pas par celui-ci.
#
# **Et ce n'est pas redondant avec le réglage du dépôt**, qui est pourtant déjà en lecture seule
# (phase 5 du passage en public, `docs/exploitation/depot-public.md` §7). Le bloc dit trois choses
# que le réglage ne dit pas : ce dont le workflow a réellement besoin, qu'il le gardera si le défaut
# du dépôt change un jour, et qu'il le gardera aussi si ce fichier est copié ailleurs. C'est le
# constat de l'analyse de code du 17/09/2026, et il portait sur les quatre travaux à la fois.
permissions:
  contents: read

# **L'image du runner est épinglée, et pas `ubuntu-latest`** : un `latest` change sous nos pieds, un
# numéro se change dans un diff que la CI de la PR prouve. `ubuntu-latest` migre vers Ubuntu 26 à
# partir du 19/10/2026 (actions/runner-images#14748) ; `ubuntu-24.04` n'est pas touché.
#
# Pour monter : passer en `ubuntu-26.04` tous les `runs-on` de `.github/workflows/` (`grep -rn runs-on`),
# et laisser la CI de la PR le prouver — Playwright (`install --with-deps`), Docker et le SDK Android
# des runners sont les étapes qui dépendent de l'image. `sauvegarde.yml` dépend en plus du dépôt pgdg :
# voir son commentaire. Registre : docs/exploitation/README.md §8.9.
jobs:
  # **Chaque travail porte un plafond, et il a été payé le 21/09/2026.** Deux travaux de la même
  # exécution ont cessé d'avancer à la même seconde, sur deux machines différentes et deux
  # commandes différentes — l'un sur `expo export --clear`, l'autre sur un script Playwright —,
  # ce qui désigne l'infrastructure et non le dépôt. Sans `timeout-minutes`, GitHub applique son
  # défaut de **six heures** : une exécution bloquée immobilise donc le retour pendant une
  # demi-journée, et consomme le quota d'autant.
  #
  # **Trente minutes, et le premier chiffre écrit ici était vingt — il était trop serré.** Le
  # raisonnement fautif partait des durées SAINES (40 s pour Jest, 3 min 30 pour l'export web et
  # le parcours réel) en oubliant que ces travaux portent des gardes Playwright dont le pire cas
  # se calcule : `verifier-rendu-export.mjs` parcourt douze routes à 45 s de `goto` + 20 s
  # d'attente + 6 s de repos, soit **quatorze minutes à elle seule**, et deux scripts la suivent
  # dans le même travail. Un plafond à vingt minutes aurait donc tué un travail simplement lent —
  # il aurait transformé de la lenteur en rouge, ce qui est pire que l'attente qu'il corrige.
  #
  # Trente minutes reste dix fois la durée saine et deux fois le pire cas modélisé, tout en
  # rendant un vrai blocage en une demi-heure au lieu de six heures. Relevé avant d'en payer le
  # prix, en modélisant le pire cas au lieu de raisonner sur la moyenne.
  checks:
    name: Typecheck & lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # **`fetch-depth: 0`, pour la garde des migrations livrées plus bas** : elle compare la copie
      # de travail à la base de fusion avec `origin/main`, que le clone à un commit par défaut ne
      # porte pas. Sans lui, elle sort en 1 — elle ne sait plus ce qui est livré, donc elle refuse.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `expo-env.d.ts` n'est pas dans le dépôt : le `postinstall` de package.json l'écrit pendant
      # `npm ci`, et `tsc` en a besoin pour l'import de `global.css`.
      - run: npx tsc --noEmit
      # `api/` est le seul code du dépôt dont la boucle de retour est un déploiement en
      # production, et c'était le seul que rien ne typecheckait : le tsconfig racine l'exclut
      # explicitement, et Vercel compile ces fichiers avec esbuild, qui efface les types sans
      # les vérifier. Une erreur de type y partait donc en production pour se manifester en
      # `FUNCTION_INVOCATION_FAILED` sans détail côté client — le mode d'échec dont l'en-tête
      # d'api/share-card.ts raconte le coût de diagnostic.
      - run: npm run typecheck:api
      # Et depuis le 20/09/2026, le typecheck n'est plus la seule chose qui regarde `api/` : les deux
      # fonctions sont **importées et appelées** sous Node — Node 22 exécute leur TypeScript tel quel —
      # sur les mêmes polices et le même wasm que Vercel embarque. La carte doit rendre par son vrai
      # chemin (le repli statique sert un pixel en `no-store`, et c'est la seule trace qui le
      # distingue d'un rendu réussi), la page doit porter le chiffre et l'image du même `?…`. Ce que
      # cette étape ne voit pas : le traçage des assets par Vercel (`includeFiles` de vercel.json),
      # qui n'existe qu'au déploiement — VERCEL.md §1.6. L'avertissement retiré est celui du type
      # stripping, encore marqué expérimental en 22.x.
      - run: node --disable-warning=ExperimentalWarning scripts/verifier-api.mjs
      - run: npm run lint
      # Cinquième garde de la famille « ce qui se lit n'est pas ce qui s'exécute » (C3.2). Le bloc
      # « Comment ce chiffre est calculé » de la restitution affiche les hypothèses du calcul —
      # 45 semaines, 1 500 km par vol, 0,25 sortie par semaine — recopiées à la main depuis
      # `recompute_assessment_results`. Une constante changée d'un côté et pas de l'autre donne un
      # écran qui explique un calcul que la base ne fait plus, et rien d'autre ne le verrait : le
      # typecheck ne traverse pas le SQL, et Jest ne peut pas lire les migrations (le tsconfig
      # racine exclut les types Node, volontairement). Ici, sans export préalable, contrairement
      # aux quatre autres gardes.
      - run: node scripts/verifier-hypotheses-calcul.mjs
      # **Les chemins que les documents citent existent-ils encore ?** La famille de défaut la
      # plus fréquente de ce dépôt n'est pas dans le calcul mais dans la prose : quatre
      # relectures du 20/09/2026 ont trouvé trente-cinq affirmations fausses et aucune erreur
      # de calcul. Celle qui a motivé cette étape : `CLAUDE.md` désignait l'écran du plan par
      # un fichier que C5.2 avait remplacé par une pile, dans son paragraphe d'orientation.
      # Ni npm ci ni export requis — le script ne lit que le système de fichiers.
      - run: node scripts/verifier-renvois-des-documents.mjs
      # **Une migration livrée a-t-elle été modifiée, supprimée ou renommée ?** Le hook de Claude Code
      # (`proteger-les-migrations-livrees.mjs`) ne voit qu'Edit et Write : le shell, un humain ou une
      # autre session passaient, et pgTAP, qui reconstruit la base depuis les fichiers, passait au
      # vert sur un fichier livré réécrit (`v1-27` §12.18). Une retouche voulue s'inscrit dans
      # `supabase/retouches-de-migrations-livrees.json`, avec l'empreinte du contenu accepté —
      # SUPABASE.md §2.3. Ni npm ci ni export requis : git seulement.
      - run: node scripts/verifier-migrations-livrees.mjs
      # **Le kit de design porte-t-il encore tous les composants du dépôt ?** Il est un miroir tenu
      # depuis le 24/09/2026 (`v1-29` §5) — la référence d'où partent les sessions de design —, et
      # le relevé à la main du 24/09 avait trouvé 36 composants absents sur 63, accumulés en
      # silence. Un composant ajouté à `src/components/` sans fiche fait rougir ici ; ce qui reste
      # à porter est une liste raisonnée qui ne doit que raccourcir. Système de fichiers seulement.
      - run: node scripts/verifier-miroir-du-kit.mjs
      # **Les deux gabarits d'e-mail vivent à deux endroits du dépôt, et rien ne les comparait.**
      # `supabase/templates/` est la copie que GoTrue inline ; `docs/exploitation/gabarits-email.md`
      # est la référence qu'on ouvre pour savoir ce que la production envoie. Deux copies d'un texte
      # divergent par une faute de frappe que personne ne relit — le raisonnement de `mois_francais`
      # et de sa jumelle. Le document affirmait d'ailleurs que cette égalité était déjà relue, et
      # c'était faux : la garde de bout en bout rend un e-mail, elle ne compare rien (relevé le
      # 21/09/2026). Elle vérifie aussi qu'aucun gabarit n'a repris un lien de confirmation — le
      # correctif de sécurité du 20/09 — et tombe ici en une seconde, là où la garde de bout en bout
      # demande Docker. Ni npm ci ni export requis.
      - run: node scripts/verifier-gabarits-email.mjs
      # expo-doctor est la garde la moins chère sur les dépendances : versions incohérentes avec le SDK,
      # modules natifs mal déclarés, configuration d'app qui ne correspond plus aux paquets. Ce qu'aucun
      # autre contrôle ne voit se paie à la prochaine construction d'AAB.
      #
      # Il compare nos versions à celles qu'Expo recommande **au moment du passage** : il rougit donc sans
      # qu'une ligne du dépôt ait bougé, dès qu'Expo publie un patch. Sur une PR ou un push il avertit
      # sans bloquer (une annotation sur le passage) ; le passage du lundi et un lancement à la main
      # bloquent, pour que la dérive se lise avant la construction et pas en travers d'une PR qui n'y est
      # pour rien. Conduite : `npx expo install --fix`, puis typecheck, lint, tests et export.
      #
      # Version de l'outil épinglée (1.20.4, publiée le 26/08/2026), sinon `npx expo-doctor` prend la
      # dernière à chaque passage. Pour la changer : le numéro ici, et sa date de publication ci-dessus.
      - id: doctor
        continue-on-error: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        run: npx expo-doctor@1.20.4
      - if: steps.doctor.outcome == 'failure'
        run: echo "::warning title=expo-doctor rouge (non bloquant)::Les paquets Expo ont du retard sur le SDK. Détail dans le journal de l'étape précédente ; correction par npx expo install --fix, puis node scripts/generer-les-licences.mjs (EXPO.md §1.9). Le passage du lundi, lui, bloquera."

  unit-tests:
    name: Tests unitaires (Jest)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # **La couverture est relevée sans seuil, et c'est le point** (C3.12) : un seuil transforme
      # une carte en obstacle, et se contourne en écrivant des tests qui touchent du code sans rien
      # affirmer. Ce qu'on veut savoir est ce qui n'est éprouvé par rien — un module de `src/types`
      # à 0 % est une dérivation affichée à quelqu'un que personne ne garde.
      #
      # Le périmètre est celui de la règle du dépôt (`src/types`, `src/lib`, `src/constants`) et pas
      # tout `src/` : les écrans ne sont pas testés, par décision — il n'y a pas encore de tests
      # d'intégration — donc les lister à 0 % à chaque passage noierait la carte dans une centaine
      # de lignes qui ne disent rien de neuf. Le jour où des tests d'écran existent, le périmètre
      # s'élargit ici. Il vit dans `package.json` (`collectCoverageFrom`), qui est du JSON et ne peut
      # pas porter cette explication.
      - run: npm test -- --ci --coverage --coverageReporters=text

  web-export:
    name: Export web
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # L'export est la seule façon de voir ce que le navigateur recevra vraiment. Deux
      # défauts s'y sont déjà cachés sans qu'aucun autre contrôle ne bronche : les routes
      # sans enfants renvoyaient 404 en production faute de `cleanUrls`, et les dix-huit
      # pages sortaient avec un `<title>` vide alors que le titre était bien déclaré (les
      # options du `Stack` n'agissent qu'après hydratation).
      # L'élagage de Metro (`EXPO_UNSTABLE_*`, étape 7 de `v1-35`, `EXPO.md` §1.13) : les mêmes drapeaux
      # que `vercel-build`, pour que la CI vérifie le bundle que Vercel construit — `rejouer-la-ci.test.ts`
      # les compare.
      - run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: cle-factice-pour-le-build
          EXPO_UNSTABLE_TREE_SHAKING: 1
          EXPO_UNSTABLE_METRO_OPTIMIZE_GRAPH: 1
      # La page que Vercel sert pour une adresse inconnue : `vercel-build` la pose après l'export, et
      # la CI fait de même pour vérifier ce que la production sert (04/10/2026, l'en-tête du script).
      - run: node scripts/poser-la-page-introuvable.mjs
      - run: node scripts/verifier-titres-export.mjs
      # Une valeur `EXPO_PUBLIC_*` peut disparaître du bundle sans que rien ne bronche, et
      # l'app démarre alors sur une configuration vide — cf. l'en-tête du script.
      - run: node scripts/verifier-configuration-export.mjs
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: cle-factice-pour-le-build
      # Les deux gardes ci-dessus **lisent** le HTML produit ; aucune ne l'exécute. Le
      # 08/09/2026 un hook natif appelé au rendu du layout racine a emporté tout l'arbre
      # React — page blanche sur toutes les routes, avec une CI verte et vingt pages titrées.
      # Celle-ci ouvre vraiment les pages dans un navigateur, cf. l'en-tête du script.
      - run: npx playwright install --with-deps chromium
      # Les deux gardes de ce travail qui ouvrent l'export servent la CSP de vercel.json telle que la production
      # l'applique, l'origine Supabase remplacée par celle de l'export (`servir-export.mjs`) : d'où
      # la variable, la même que celle de l'export.
      - run: node scripts/verifier-rendu-export.mjs
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
      # Celle du dessus vérifie que l'app **démarre** ; celle-ci, ce qu'elle **montre**. Les ~15 000
      # lignes d'écrans ne sont testées par rien d'autre (décision de TESTING.md §1.6), et la
      # contre-lecture du lot 5 a trouvé trois défauts d'état d'écran qu'aucune garde ne voyait.
      # Périmètre volontairement étroit : les seuls états qui se décident **sans réseau**, l'export
      # de CI portant une configuration Supabase factice.
      - run: node scripts/verifier-etats-export.mjs
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
      # Le rappel par email ne porte qu'une URL : Android ne l'ouvre dans l'app que si le
      # domaine l'y autorise par ce fichier. Absent ou désignant un autre paquet, le lien
      # retombe dans le navigateur sans que rien ne le signale.
      - run: node scripts/verifier-assetlinks-export.mjs

  db-tests:
    name: Tests base de données (pgTAP)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Démarre une stack Postgres locale (Docker) à partir de supabase/config.toml et
      # applique supabase/migrations/ — indépendante du projet Supabase distant
      # TraceVerte-v1, cf. supabase/config.toml.
      #
      # Version épinglée, et pas `latest`. Le CLI apporte la stack locale entière (image
      # Postgres, rôles, privilèges par défaut, GoTrue, PostgREST) : en `latest`, cette moitié
      # de la CI changeait sous nos pieds à chaque sortie du CLI, sans qu'une ligne du dépôt
      # bouge — une suite rouge le lundi sur un commit vert le vendredi, sans rien à lire pour
      # le comprendre. Ce sont précisément les privilèges par défaut qui devaient nous tomber
      # dessus par là : c'est le CLI, et lui seul, qui décide si une nouvelle table du schéma
      # `public` arrive exposée ou non (cf. supabase/config.toml et
      # supabase/migrations/20260910110000_grants_explicites.sql).
      #
      # 2.117.0 relevé le 10/09/2026 sur le registre npm : publiée le 07/09/2026 et toujours le
      # `dist-tag` latest ce jour-là — c'est donc la version que `latest` installait déjà aux
      # derniers passages de cette CI. L'épinglage fige l'état connu, il ne le change pas.
      #
      # Pour la faire évoluer : changer le numéro ici, rien d'autre, et laisser la CI de la PR
      # le prouver. Une montée qui casse se lit alors dans le diff, ce qui est tout l'intérêt.
      # Reporter alors le numéro **et** sa date de publication ci-dessus, et ne jamais revenir à
      # `latest` : un tag qui n'existe pas fait tomber tout ce job, pas seulement une assertion.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - run: supabase db start
      - run: supabase test db
      # **`src/lib/database.types.ts` est tenu à la main, donc il dérive** (C3.12 §3). Le typecheck
      # ne peut pas l'attraper : il vérifie le code **contre ce fichier**, jamais le fichier contre
      # la base. Une colonne oubliée dans le bloc `Insert` rend impossible d'écrire une colonne qui
      # existe ; une colonne fantôme laisse écrire une colonne qui n'existe plus, et l'échec arrive
      # à l'exécution, en anglais, chez la personne.
      #
      # La comparaison porte sur les **colonnes** et pas sur le texte — l'audit avait prévu qu'un
      # `diff` brut serait rouge dès le premier passage pour une raison de forme : le fichier du
      # dépôt est généré depuis le projet distant et retouché à la main, la CI produit la sortie du
      # CLI local, et les deux mises en forme n'ont aucune raison de coïncider. Détail dans
      # l'en-tête du script.
      - run: supabase gen types typescript --local > /tmp/database.types.generated.ts
      - run: node scripts/verifier-types-base.mjs /tmp/database.types.generated.ts
      # **Dix-sept listes de valeurs écrites en TypeScript recopient un `check` du schéma**, et la
      # convention du dépôt les épinglait par des tests portant les mêmes valeurs recopiées une
      # seconde fois : le code était gardé contre lui-même, jamais contre la base. Ce contrôle lit
      # `pg_constraint` sur la base que `supabase/migrations/` vient de construire. Détail, et les
      # sept mutations qui l'ont éprouvé, dans l'en-tête du script.
      #
      # Deux choses que ce travail n'a pas et qu'il ne lui faut pas : `npm ci` (le graphe importé
      # ne sort pas de `src/`) et `psql` installé (l'image ubuntu-24.04 embarque le client 16, qui
      # interroge très bien un serveur 17 — c'est `pg_dump` qui exige la même majeure, cf.
      # `.github/workflows/sauvegarde.yml`). Node, en revanche, doit être en 22.18 au moins : c'est
      # lui qui retire les types pour importer `src/types/*.ts`.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/verifier-miroirs-de-check.mjs

  parcours-reel:
    name: Parcours réel (stack locale)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Même version que le travail pgTAP, pour la même raison : c'est le CLI qui apporte la stack.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      # **`supabase start`, et pas `db start` comme pour pgTAP** : le parcours a besoin de GoTrue (la
      # session anonyme que chaque visiteur reçoit) et de PostgREST (toutes les lectures de l'app),
      # pas seulement de Postgres. Les services que supabase/config.toml désactive (studio, realtime,
      # storage, mail) ne démarrent pas ; le reste applique supabase/migrations/ — la même base que
      # les tests pgTAP, avec l'API devant.
      - run: supabase start
      # Les clés de la stack locale sont des JWT de démonstration, publics et identiques sur toute
      # machine (le CLI les imprime) : elles passent par l'environnement du travail, jamais par un
      # fichier, et `supabase status -o env` les donne sous la forme `CLE="valeur"`, que le shell lit.
      - run: |
          supabase status -o env > /tmp/stack.env
          . /tmp/stack.env
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$API_URL"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      # Un second export, branché sur la stack locale — celui du travail « Export web » porte une
      # configuration factice, exprès. `--clear` parce que les `EXPO_PUBLIC_*` sont inlinées à la
      # transformation et que le cache de Metro ne les met pas dans sa clé : sans lui, un export qui
      # suit un autre garde l'URL de l'autre (mesuré le 20/09/2026, TESTING-GARDES.md §2.6). Sur un runner
      # neuf le cache est vide, et l'option est là pour que la commande soit la même qu'en local.
      - run: npx expo export --platform web --clear
        env:
          EXPO_UNSTABLE_TREE_SHAKING: 1
          EXPO_UNSTABLE_METRO_OPTIMIZE_GRAPH: 1
      - run: npx playwright install --with-deps chromium
      # Le parcours nominal de bout en bout, sur le profil de docs/recette/premier-parcours-web.md,
      # avec la base relue après chaque écriture : l'en-tête du script dit ce qu'il couvre et ce
      # qu'il laisse volontairement aux autres gardes. Sur un échec, il imprime l'étape, le texte
      # visible et les requêtes refusées — c'est ce qu'on lit avant le code.
      - run: node scripts/verifier-parcours-reel.mjs
      # **La capture d'un échec sort de la CI, et elle seule** (décision de la personne qui pilote,
      # 01/10/2026, `v1-27` §12.26). Le 30/09, l'étape de la suppression du compte a rougi, et il a
      # fallu cinq parcours complets pour trouver ce qu'une image aurait peut-être montré d'un coup —
      # le lien 412 px plus bas que le clic. Le dépôt est public, donc l'artefact l'est aussi : il ne
      # montre qu'une page de test sur une stack locale aux clés de démonstration, et il disparaît
      # après sept jours. Le chemin est relevé, pas supposé : le journal de l'échec du 30/09 imprime
      # « Capture : /tmp/ramille-parcours-reel-echec.png ». `warn` et non `ignore`, pour qu'un chemin
      # devenu faux se lise dans le journal au lieu de se taire.
      # Le rejeu local n'a rien à rejouer ici : la capture y reste dans le dossier temporaire.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: parcours-reel-echec
          path: /tmp/ramille-parcours-reel-echec.png
          retention-days: 7
          if-no-files-found: warn
      # Le chemin du compte, de bout en bout : le collecteur d'e-mails local (`[local_smtp]`,
      # allumé le 20/09/2026) rend testable le rattachement comme la reconnexion. Peu d'assertions,
      # dont deux seulement sont des chemins heureux — leur nombre ne s'écrit pas ici, il s'est
      # périmé le 21/09/2026 ; l'en-tête du script dit laquelle garde quoi,
      # ce que chaque mutation fait tomber, et ce qu'aucune ne peut prétendre (le code est un
      # porteur : il relève le prix de la mauvaise confirmation, il ne la ferme pas).
      - run: node scripts/verifier-code-de-connexion.mjs
