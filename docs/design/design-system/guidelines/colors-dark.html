<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);color:var(--color-text);background:var(--color-background);padding:20px;box-sizing:border-box}.lbl{font-family:var(--font-mono);font-size:11px;line-height:16px;color:var(--color-text-tertiary)}.row{display:flex;gap:12px;align-items:flex-end}.col{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}</style></head><body><div data-theme="dark" style="background:var(--color-background);padding:16px;border-radius:16px;margin:-8px"><div class="row"><div class="col"><div style="height:52px;border-radius:12px;background:var(--color-accent);"></div><div class="lbl">accent #3D9B6F<br>--color-accent</div></div><div class="col"><div style="height:52px;border-radius:12px;background:var(--color-accent-text);"></div><div class="lbl">accentText #8FCBA9<br>--color-accent-text</div></div><div class="col"><div style="height:52px;border-radius:12px;background:var(--color-accent-muted);"></div><div class="lbl">accentMuted #3A5245<br>--color-accent-muted</div></div><div class="col"><div style="height:52px;border-radius:12px;background:var(--color-background-selected);"></div><div class="lbl">selected #1C2E22<br>--color-background-selected</div></div><div class="col"><div style="height:52px;border-radius:12px;background:var(--color-background-element);"></div><div class="lbl">element #212225<br>--color-background-element</div></div><div class="col"><div style="height:52px;border-radius:12px;background:var(--color-border);"></div><div class="lbl">border #2E3135<br>--color-border</div></div><div class="col"><div style="height:52px;border-radius:12px;background:var(--color-text-secondary);"></div><div class="lbl">textSecondary #B0B4BA<br>--color-text-secondary</div></div></div></div></body></html>
