<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);color:var(--color-text);background:var(--color-background);padding:20px;box-sizing:border-box}.lbl{font-family:var(--font-mono);font-size:11px;line-height:16px;color:var(--color-text-tertiary)}.row{display:flex;gap:12px;align-items:flex-end}.col{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}</style></head><body><div style="display:flex;gap:24px;align-items:center"><div style="width:180px;height:120px;border-radius:14px;border:1px solid var(--color-border);position:relative;overflow:hidden"><div style="position:absolute;inset:0 24px;border-left:1px dashed var(--color-accent-muted);border-right:1px dashed var(--color-accent-muted)"></div><div style="position:absolute;left:24px;right:24px;top:16px;height:10px;border-radius:5px;background:var(--color-background-element)"></div><div style="position:absolute;left:24px;right:24px;top:36px;height:30px;border-radius:8px;background:var(--color-background-element)"></div><div style="position:absolute;left:24px;right:24px;bottom:12px;height:18px;border-radius:9px;background:var(--color-accent)"></div></div><div style="font-size:14px;line-height:20px;color:var(--color-text-secondary);text-wrap:pretty;flex:1">Marge horizontale <b>24 px</b>. Contenu défilant avec <b>gap 32</b> entre blocs (StepShell) ou 20–28 selon l’écran. Le bouton principal vit dans un pied collant, hors du défilement, padding 24. Largeur de contenu max 800 sur web.</div></div></body></html>
