<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);color:var(--color-text);background:var(--color-background);padding:20px;box-sizing:border-box}.lbl{font-family:var(--font-mono);font-size:11px;line-height:16px;color:var(--color-text-tertiary)}.row{display:flex;gap:12px;align-items:flex-end}.col{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}</style></head><body><div class="row"><div class="col"><div style="height:52px;border-radius:12px;background:var(--color-text);"></div><div class="lbl">text #131612<br>--color-text</div></div><div class="col"><div style="height:52px;border-radius:12px;background:var(--color-text-secondary);"></div><div class="lbl">textSecondary #39403B<br>--color-text-secondary</div></div><div class="col"><div style="height:52px;border-radius:12px;background:var(--color-text-tertiary);"></div><div class="lbl">textTertiary #5E655F<br>--color-text-tertiary</div></div><div class="col" style="flex:2"><div style="height:52px;display:flex;align-items:center;font-size:15px;line-height:22px;color:var(--color-text-secondary)">Pas de rouge, pas d’orange, pas d’icône d’alerte. Une hausse d’empreinte est un fait, jamais une faute.</div><div class="lbl">règle §5</div></div></div></body></html>
