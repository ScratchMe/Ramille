<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);color:var(--color-text);background:var(--color-background);padding:20px;box-sizing:border-box}.lbl{font-family:var(--font-mono);font-size:11px;line-height:16px;color:var(--color-text-tertiary)}.row{display:flex;gap:12px;align-items:flex-end}.col{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}</style></head><body><div style="display:flex;gap:32px;align-items:center"><img src="../assets/images/logo-mark.svg" width="72" height="72" alt=""><img src="../assets/images/mascot-mark.svg" width="72" height="72" alt=""><img src="../assets/images/favicon-mark.svg" width="32" height="32" alt=""><div style="flex:1;font-size:14px;line-height:20px;color:var(--color-text-secondary);text-wrap:pretty">La silhouette ne change jamais. Le logo est la feuille seule ; la mascotte est la même feuille avec un visage. Le favicon simplifie (sans joues ni nervure) — un dessin figé peut, un composant non.</div></div></body></html>
