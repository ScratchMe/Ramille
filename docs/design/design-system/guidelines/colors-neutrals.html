<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);color:var(--color-text);background:var(--color-background);padding:20px;box-sizing:border-box}.lbl{font-family:var(--font-mono);font-size:11px;line-height:16px;color:var(--color-text-tertiary)}.row{display:flex;gap:12px;align-items:flex-end}.col{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}</style></head><body><div class="row"><div class="col"><div style="height:52px;border-radius:12px;background:var(--color-background);border:1px solid var(--color-border)"></div><div class="lbl">background #FFFFFF<br>--color-background</div></div><div class="col"><div style="height:52px;border-radius:12px;background:var(--color-background-element);"></div><div class="lbl">backgroundElement #F0F1EC<br>--color-background-element</div></div><div class="col"><div style="height:52px;border-radius:12px;background:var(--color-background-element-2);"></div><div class="lbl">backgroundElement2 #F6F8F3<br>--color-background-element-2</div></div><div class="col"><div style="height:52px;border-radius:12px;background:var(--color-border);"></div><div class="lbl">border #DDE0D9<br>--color-border</div></div><div class="col"><div style="height:52px;border-radius:12px;background:var(--color-pagination-inactive);"></div><div class="lbl">paginationInactive #CDD7CF<br>--color-pagination-inactive</div></div></div></body></html>
