<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-sans);color:var(--color-text);background:var(--color-background);padding:20px;box-sizing:border-box}.lbl{font-family:var(--font-mono);font-size:11px;line-height:16px;color:var(--color-text-tertiary)}.row{display:flex;gap:12px;align-items:flex-end}.col{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}</style></head><body><div class="row"><div class="col"><div style="height:52px;border-radius:12px;background:var(--color-accent);"></div><div class="lbl">accent #1F6F4A<br>--color-accent</div></div><div class="col"><div style="height:52px;border-radius:12px;background:var(--color-accent-text);"></div><div class="lbl">accentText #14563A<br>--color-accent-text</div></div><div class="col"><div style="height:52px;border-radius:12px;background:var(--color-accent-muted);"></div><div class="lbl">accentMuted #A9C8B6<br>--color-accent-muted</div></div><div class="col"><div style="height:52px;border-radius:12px;background:var(--color-background-selected);"></div><div class="lbl">backgroundSelected #E4EFE8<br>--color-background-selected</div></div><div class="col"><div style="height:52px;border-radius:12px;background:var(--color-background-tinted);"></div><div class="lbl">backgroundTinted #F3F8F4<br>--color-background-tinted</div></div></div></body></html>
