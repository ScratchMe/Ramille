<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #14563A; } a:hover { color: #1F6F4A; }
  </style>
</helmet>
<div style="display: inline-flex; align-items: center; justify-content: center; width: {{size}}px; height: {{size}}px; transform: rotate({{tilt}}deg)">
  <svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true">
    <path d="M50,8 C78,26 84,56 50,92 C16,56 22,26 50,8 Z" fill="#1F6F4A"></path>
    <path d="M50,18 C46,26 46,32 50,38" stroke="#E4EFE8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.55"></path>
    <circle cx="33" cy="{{blushCy}}" r="{{blushR}}" fill="#A9C8B6" opacity="{{blushO}}"></circle>
    <circle cx="67" cy="{{blushCy}}" r="{{blushR}}" fill="#A9C8B6" opacity="{{blushO}}"></circle>
    <sc-if value="{{isDots}}" hint-placeholder-val="{{ true }}">
      <circle cx="39" cy="50" r="4.2" fill="#131612"></circle>
      <circle cx="61" cy="50" r="4.2" fill="#131612"></circle>
    </sc-if>
    <sc-if value="{{isHappy}}" hint-placeholder-val="{{ false }}">
      <path d="M34,49 Q39,44 44,49" stroke="#131612" stroke-width="3.4" stroke-linecap="round" fill="none"></path>
      <path d="M56,49 Q61,44 66,49" stroke="#131612" stroke-width="3.4" stroke-linecap="round" fill="none"></path>
    </sc-if>
    <sc-if value="{{isSoft}}" hint-placeholder-val="{{ false }}">
      <path d="M35,51 Q39,54 43,51" stroke="#131612" stroke-width="3.4" stroke-linecap="round" fill="none"></path>
      <path d="M57,51 Q61,54 65,51" stroke="#131612" stroke-width="3.4" stroke-linecap="round" fill="none"></path>
    </sc-if>
    <sc-if value="{{isUp}}" hint-placeholder-val="{{ false }}">
      <circle cx="38" cy="47" r="4.2" fill="#131612"></circle>
      <circle cx="60" cy="47" r="4.2" fill="#131612"></circle>
    </sc-if>
    <sc-if value="{{isClosed}}" hint-placeholder-val="{{ false }}">
      <path d="M34,50 Q39,55 44,50" stroke="#131612" stroke-width="3.4" stroke-linecap="round" fill="none"></path>
      <path d="M56,50 Q61,55 66,50" stroke="#131612" stroke-width="3.4" stroke-linecap="round" fill="none"></path>
    </sc-if>
    <path d="{{mouth}}" stroke="#131612" stroke-width="3.2" stroke-linecap="round" fill="none"></path>
  </svg>
</div>
</x-dc>
<script data-dc-script data-props='{"mood":{"editor":"enum","options":["calm","happy","encouraging","thinking","resting"],"default":"calm"},"size":{"editor":"int","default":40,"min":16,"max":160,"unit":"px"},"tilt":{"editor":"range","default":0,"min":-12,"max":12,"step":1,"unit":"deg"},"$preview":{"width":120,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    var FACES = {
      calm:        { eyes: 'dots',   mouth: 'M42,62 Q50,68 58,62', blushO: 0.55, blushR: 5,   blushCy: 60 },
      happy:       { eyes: 'happy',  mouth: 'M40,60 Q50,72 60,60', blushO: 0.6,  blushR: 5.4, blushCy: 59 },
      encouraging: { eyes: 'soft',   mouth: 'M43,63 Q50,66 57,63', blushO: 0.55, blushR: 5,   blushCy: 60 },
      thinking:    { eyes: 'up',     mouth: 'M45,63 L55,63',       blushO: 0.4,  blushR: 4.6, blushCy: 61 },
      resting:     { eyes: 'closed', mouth: 'M44,63 Q50,66 56,63', blushO: 0.5,  blushR: 5,   blushCy: 60 }
    };
    var mood = this.props.mood || 'calm';
    var f = FACES[mood] || FACES.calm;
    return {
      size: this.props.size ?? 40,
      tilt: this.props.tilt ?? 0,
      mouth: f.mouth, blushO: f.blushO, blushR: f.blushR, blushCy: f.blushCy,
      isDots: f.eyes === 'dots', isHappy: f.eyes === 'happy', isSoft: f.eyes === 'soft',
      isUp: f.eyes === 'up', isClosed: f.eyes === 'closed'
    };
  }
}
</script>
</body>
</html>
