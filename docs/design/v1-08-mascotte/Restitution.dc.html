<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; padding: 24px; padding-top: 56px; gap: 16px">

      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; justify-content: space-between"><div style="font-size: 14px; color: #39403B">Moyenne française</div><div style="font-size: 14px; color: #39403B">2,8 t</div></div>

  <div style="flex-grow: 1"></div>
  <div style="height: 54px; border-radius: 27px; background: #1F6F4A; display: flex; align-items: center; justify-content: center">
